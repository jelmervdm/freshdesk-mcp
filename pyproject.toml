[project]
name = "freshdesk-mcp-server"
version = "0.3.1"
description = "MCP server for Freshdesk helpdesk integration"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "Jelmer van der Mul"},
]
keywords = ["freshdesk", "mcp", "model-context-protocol", "helpdesk", "ticketing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp[cli]>=1.2.0,<3.0.0",
    "httpx>=0.20.0",
]

[project.optional-dependencies]
router = [
    "fastembed>=0.4.0",
    "numpy>=1.26.0",
]

[project.scripts]
freshdesk-mcp-server = "freshdesk_mcp:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["freshdesk_mcp", "freshdesk_mcp.tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::pytest.PytestAssertRewriteWarning"
    ]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = true

[tool.black]
line-length = 100
target-version = ["py311"]
